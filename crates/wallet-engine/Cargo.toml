[package]
name = "wallet-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wallet-policy = { path = "../wallet-policy" }
wallet-keys = { path = "../wallet-keys" }
monero-wallet = "=0.2.0"
monero-daemon-rpc = "=0.2.0"
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
zeroize = { version = "=1.8.2", features = ["derive"] }
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
