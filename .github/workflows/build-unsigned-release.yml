name: Build UNSIGNED Independent Wallet release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  unsigned-release:
    name: Compile and verify unsigned Independent Wallet
    # No release build unless every test and lint passed.
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          [ -n "$version" ] || { echo 'versionName not found' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - name: Install pinned cargo-ndk helper
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Rust native libraries and generate UniFFI Kotlin
        run: bash scripts/build-android-native.sh
      - name: Build unsigned minified release (NO signing keys)
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify unsigned APK, ABI coverage and alignment
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          python3 scripts/verify-unsigned-apk.py "$apk" --lib libindependent_wallet.so --abi arm64-v8a --abi x86_64
          python3 scripts/check-apk.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"; then
            echo 'ERROR: release APK is already signed' >&2
            exit 1
          fi
          sha256sum "$apk" > independent-wallet-unsigned.sha256
          cat independent-wallet-unsigned.sha256
      - name: Downloadable unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: voidkey-${{ steps.version.outputs.version }}-UNSIGNED
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            independent-wallet-unsigned.sha256

  # Manual runs also put the unsigned APK in a private draft release, visible
  # only to repository maintainers: users must never see an uninstallable file.
  # The owner signs it and publishes the signed APK. Only this small job can write to the repository: it runs
  # no third-party actions and no build tools, and never sees a signing key.
  publish-prerelease:
    name: Publish unsigned draft release
    if: github.event_name == 'workflow_dispatch'
    needs: unsigned-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voidkey-${{ needs.unsigned-release.outputs.version }}-UNSIGNED
      - name: Create or update the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.unsigned-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-unsigned"
          apk="voidkey-${VERSION}-UNSIGNED.apk"
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          hash=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "$hash  $apk" > "$apk.sha256"
          notes="UNSIGNED test build ${VERSION} from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. It cannot be installed until you sign it with your own key. Draft: only maintainers can see it; attach the signed APK and publish it for users. Developer preview: not for real funds.

          APK SHA-256: ${hash}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" "$apk.sha256" --draft --prerelease --target "$GITHUB_SHA" \
              --title "VoidKey ${VERSION} (UNSIGNED)" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
