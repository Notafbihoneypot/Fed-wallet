name: Build UNSIGNED Independent Wallet release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unsigned-release:
    name: Compile and verify unsigned Independent Wallet
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - name: Install pinned cargo-ndk helper
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Rust native libraries and generate UniFFI Kotlin
        run: bash scripts/build-android-native.sh
      - name: Build unsigned minified release (NO signing keys)
        working-directory: android
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify unsigned APK, ABI coverage and alignment
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          python3 scripts/verify-unsigned-apk.py "$apk" --lib libindependent_wallet.so --abi arm64-v8a --abi x86_64
          python3 scripts/check-apk.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"; then
            echo 'ERROR: release APK is already signed' >&2
            exit 1
          fi
          sha256sum "$apk" > independent-wallet-unsigned.sha256
          cat independent-wallet-unsigned.sha256
      - name: Downloadable unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: independent-wallet-v0.11.11-UNSIGNED-release
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            independent-wallet-unsigned.sha256
